<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarkt Agent</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #1e293b; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }
        .card { background: white; border-radius: 10px; padding: 15px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card.prio { border-left: 5px solid #2563eb; }
        .badge { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-right: 8px; }
        .prio-badge { background: #dbeafe; color: #1e40af; }
        .discount { background: #dcfce7; color: #166534; font-weight: bold; padding: 6px 12px; border-radius: 20px; }
        .price { font-size: 18px; font-weight: bold; color: #0f172a; }
        .old-price { text-decoration: line-through; color: #94a3b8; font-size: 14px; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Supermarkt Agent</h1>
        <p class="subtitle">Wöchentliche Top-Angebote (≥ 15% Rabatt | Lidl & Kaufland zuerst)</p>
        <div id="deals-list">Lädt aktuelle Angebote...</div>
    </div>

    <script>
        async function loadDeals() {
            try {
                const response = await fetch('deals.json');
                const data = await response.json();
                const container = document.getElementById('deals-list');
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">Keine Angebote gefunden.</p>';
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="card ${item.is_prio ? 'prio' : ''}">
                        <div>
                            <span class="badge ${item.is_prio ? 'prio-badge' : ''}">${item.store}</span>
                            <strong>${item.title}</strong>
                        </div>
                        <div style="text-align: right;">
                            <span class="price">${item.price.toFixed(2)} €</span>
                            <span class="old-price">${item.old_price.toFixed(2)} €</span>
                            <span class="discount">-${item.discount}%</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('deals-list').innerHTML = 
                    '<p style="text-align:center; color:red;">Fehler beim Laden der Angebote.</p>';
            }
        }
        loadDeals();
    </script>
</body>
</html>
